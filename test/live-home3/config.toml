provider = "custom"
model = "nvidia/nemotron-3-super-120b-a12b"
base_url = "https://integrate.api.nvidia.com/v1"
custom_api_key_env = "NVIDIA_API_KEY"

[extra_headers]
Accept = "application/json"
User-Agent = "hephaestus-rs"

[extra_body]
temperature = 0.2
max_tokens = 2048

[[permissions.rules]]
tool = "bash"
pattern = "echo *"
action = "allow"

[[permissions.rules]]
tool = "db_write"
pattern = "e2e"
action = "allow"

[databases.e2e]
url = "sqlite:///home/marsel/projects/Hephaestus-agent/Hephaestus-agent-rs/test/results/e2e.db?mode=rwc"
read_only = false
description = "тестовая база e2e"

[databases.redis-e2e]
url = "redis://127.0.0.1:56379/0"
read_only = false
description = "живой redis"
