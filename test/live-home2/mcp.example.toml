# MCP-серверы Гефеста. Скопируйте в mcp.toml и раскомментируйте нужное:
#   cp mcp.example.toml mcp.toml
#
# Каждый сервер: name, transport (stdio|http), command или url.
# Инструменты сервера регистрируются в общий реестр автоматически.

# Пример 1: filesystem MCP (доступ к папке вне рабочей директории).
# [[server]]
# name = "filesystem"
# transport = "stdio"
# command = ["npx", "-y", "@modelcontextprotocol/server-filesystem", "/home/user/data"]
# timeout_ms = 30000

# Пример 2: MongoDB (встроенных mongo-инструментов нет — подключаем MCP).
# [[server]]
# name = "mongo"
# transport = "stdio"
# command = ["npx", "-y", "mcp-server-mongodb", "mongodb://localhost:27017"]
# timeout_ms = 30000

# Пример 3: удалённый HTTP-сервер (SSE) с заголовком авторизации.
# [[server]]
# name = "remote-tools"
# transport = "http"
# url = "https://tools.example.com/mcp"
# headers = { Authorization = "Bearer {env:REMOTE_TOKEN}" }
# timeout_ms = 60000
