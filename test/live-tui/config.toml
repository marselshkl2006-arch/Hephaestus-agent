provider = "custom"
model = "nvidia/nemotron-3-super-120b-a12b"
base_url = "https://integrate.api.nvidia.com/v1"
custom_api_key_env = "NVIDIA_API_KEY"

[extra_headers]
Accept = "application/json"
User-Agent = "hephaestus-rs"

[extra_body]
temperature = 0.2
max_tokens = 2048

[[permissions.rules]]
tool = "bash"
pattern = "echo *"
action = "allow"

[databases.pg-e2e]
url = "postgres://e2e:e2epass@127.0.0.1:55432/e2e"
read_only = false
description = "живой postgres e2e"

[[permissions.rules]]
tool = "db_write"
pattern = "pg-e2e"
action = "allow"
