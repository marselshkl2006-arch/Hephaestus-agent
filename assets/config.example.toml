# Пример конфига Гефеста. Скопируйте в config.toml и поправьте под себя:
#   cp config.example.toml config.toml
#
# НЕ храните секреты в этом файле — используйте {env:VAR} (см. [databases]).

# ── Основной провайдер LLM ──────────────────────────────────────────────
provider = "ollama"          # ollama | custom | anthropic | openai | openrouter | koboldcpp | llama_server
model = "llama3.2:3b"        # модель провайдера
base_url = "http://localhost:11434"

# ── SMALL MODEL (необязательно) ─────────────────────────────────────────
# Дешёвая модель для служебных задач (сжатие контекста, подсказки).
# Основная модель не тратит контекст на черновую работу.
# small_model = "qwen2.5:3b"

# ── Permissions-as-data ─────────────────────────────────────────────────
# Декларативные правила: что делать без вопроса человеку.
# Порядок важен — ПОСЛЕДНЕЕ совпавшее правило выигрывает.
# Слои: встроенные дефолты (.env/ключи → ask) → эти правила → правила сессии.
#
# [[permissions.rules]]
# tool = "bash"          # bash | edit | read | delete | db_write | *
# pattern = "git *"      # glob по команде/пути/имени подключения
# action = "allow"       # allow | ask | deny
#
# [[permissions.rules]]
# tool = "bash"
# pattern = "cargo *"
# action = "allow"
#
# [[permissions.rules]]
# tool = "delete"
# pattern = "**/*.log"
# action = "ask"

# ── Универсальные БД (db_query/db_redis) ────────────────────────────────
# Секреты — только через переменные окружения: {env:PG_PASSWORD}.
#
# [databases.prod]
# url = "postgres://app:{env:PG_PASSWORD}@10.0.0.5/appdb"
# read_only = true                # DML/DDL запрещены на уровне инструмента
# description = "прод, только чтение"
#
# [databases.dev]
# url = "mysql://dev:{env:MYSQL_PASSWORD}@localhost/devdb"
# read_only = false               # запись требует подтверждения (db_write)
# description = "тестовая база"
#
# [databases.cache]
# url = "redis://127.0.0.1:6379/0"
# read_only = true
# description = "redis-кэш"
#
# MongoDB — через MCP-сервер (см. mcp.example.toml) или скилл database-mongodb.

# ── Рабочая директория инструментов ─────────────────────────────────────
# /work_dir в REPL тоже её меняет (сохраняется сюда).
# work_dir = "~/projects/hephaestus"
